[package]
name = "Voxel"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["bevy_dev_tools", "dynamic_linking"] }
rand = "0.10.1"


[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dev-dependencies]
bevy = { version = "0.18.1", features = ["debug"] }
